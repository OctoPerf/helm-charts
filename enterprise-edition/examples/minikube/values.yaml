---
# 192.168.49.2.sslip.io resolves to the minikube node (= `minikube ip`, stable at
# 192.168.49.2 for the default docker-driver profile), where Traefik listens on
# hostPort 80 (see traefik-values.yaml). It resolves the same way from your browser
# and from the pods, so no `minikube tunnel` and no mcpServer.hostAliases are needed.
# With another driver or profile, replace it with `$(minikube ip).sslip.io`.

elasticsearch:
  enabled: true
  esJavaOpts: "-Xmx1g -Xms1g"
  # Request smaller persistent volumes.
  volumeClaimTemplate:
    accessModes: [ "ReadWriteOnce" ]
    storageClassName: "standard"
    resources:
      requests:
        storage: 4Gi

doc:
  enabled: false

utilityServer:
  enabled: false

mcpServer:
  enabled: true
  applicationYml: |-
    server:
      hostname: 192.168.49.2.sslip.io
      public:
        port: 80

backend:
  applicationYml: |-
    server:
      hostname: 192.168.49.2.sslip.io
      public:
        port: 80
    elasticsearch:
      hostname: elasticsearch-master-headless
      # Must match elasticsearch password
      password: "0ct0P3rf"

ingress:
  enabled: true
  hosts:
    - 192.168.49.2.sslip.io
