# Values for the official Traefik Helm chart (https://traefik.github.io/charts), used by `make configure`.
ingressClass:
  enabled: true
  isDefaultClass: true

# With hostPort, the new pod cannot start on the single minikube node while the old one holds port 80:
# replace the pod instead of surging, otherwise `helm upgrade` hangs.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Traefik is reached on the hostPort of the minikube node (see ports.web below):
# a LoadBalancer service would stay <pending> without `minikube tunnel`, and
# `helm upgrade --install --wait` would time out waiting for its external IP.
service:
  spec:
    type: ClusterIP

ports:
  web:
    # Expose Traefik on port 80 of the minikube node, so that the browser and the
    # pods both reach it on 192.168.49.2.sslip.io (see values.yaml).
    hostPort: 80
    transport:
      respondingTimeouts:
        # Traefik v3 defaults to 60s, which breaks large uploads.
        readTimeout: 3600s
  websecure:
    transport:
      respondingTimeouts:
        readTimeout: 3600s

providers:
  kubernetesIngress:
    # Traefik >= v3.5. Match Ingress "Prefix" paths per path element, as required by the Kubernetes spec:
    # /doc matches /doc and /doc/guide, but not /docker/rendezvous (which goes to the backend).
    strictPrefixMatching: true
