---

registry: "registry.hub.docker.com"
version: "18.0.0"

imagePullPolicy: Always
imagePullSecrets: []
# - name: "image-pull-secret"

# Labels added to every resource and pod of the chart, e.g. corporate labels required by a policy:
# commonLabels:
#   env: production
commonLabels: {}

# Elastic Cloud (or any Elasticsearch served over HTTPS on 443) reached through Istio, which originates the TLS.
# Requires the backend pods to run with an Istio sidecar. The chart creates the "<name>-elastic-cloud-proxy"
# Service (port 9200): Istio sends its plain HTTP traffic to elasticCloud.host on 443, over TLS.
# Also set elasticsearch.enabled: false, and in backend.applicationYml:
#   elasticsearch:
#     hostname: enterprise-edition-elastic-cloud-proxy
#     password: <Elastic Cloud password of the elastic user>
elasticCloud:
  istio:
    enabled: false
  # Elastic Cloud endpoint, without scheme nor port, e.g. my-deployment.es.europe-west1.gcp.cloud.es.io
  host: ""

elasticsearch:
  enabled: true
  protocol: http
  image: "elasticsearch"
  imageTag: "8.19.23"
  replicas: 1
  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"
  createCert: false
  # Change Default Elasticsearch Password Here and below (in backend application.yml)
  secret:
    enabled: true
    password: "0ct0P3rf"
  # Turn off TLS inside Elasticsearch itself
  esConfig:
    elasticsearch.yml: |
      xpack.security.enabled: false
      xpack.security.transport.ssl.enabled: false
      xpack.security.http.ssl.enabled: false
      xpack.security.enrollment.enabled: false

ingress:
  # Before enabling, make sure to provide hosts / tls below
  enabled: false

  # Requires Traefik v3 with the kubernetesCRD provider enabled (traefik.io CRDs installed)
  className: traefik

  traefik:
    middlewares:
      # Create the chart Traefik Middlewares (compress, /ui and /doc prefix stripping, /doc trailing slash redirect)
      # and attach them to the ingress routers
      enabled: true
    # Optional router entrypoints, e.g. "websecure" (annotation traefik.ingress.kubernetes.io/router.entrypoints)
    entrypoints: ""
    # Additional middlewares appended to every ingress router, after the chart ones.
    # Format: <namespace>-<name>@kubernetescrd
    extraMiddlewares: []
    # - traefik-security-headers@kubernetescrd

  # Keys defined here take precedence over the chart generated ones
  # (traefik.ingress.kubernetes.io/router.middlewares, traefik.ingress.kubernetes.io/router.entrypoints).
  # Prefer ingress.traefik.* to configure them.
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  path: /
  hosts: []
    # Possibly define host in /etc/hosts
    # - enterprise-edition.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local


backend:
  enabled: true
  image: octoperf/enterprise-edition
  replicas: 1
  port: 8090

  annotations: {}

  podAnnotations: {}

  # serviceAccountName: "myServiceAccount"

  initContainers: []

  affinity: {}
  #  podAntiAffinity:
  #  requiredDuringSchedulingIgnoredDuringExecution:
  #  - labelSelector:
  #      matchExpressions:
  #      - key: app
  #        operator: In
  #        values:
  #        - {{ template "name" . }}-backend
  #    topologyKey: "kubernetes.io/hostname"

  tolerations: {}

  env:
    JAVA_OPTS: "-Xms1g -Xmx1g"

  # License file content  
  # licenseFile: |-

  # config/application.yml
  applicationYml: |-
    server:
      public:
        port: 80
    elasticsearch:
      hostname: elasticsearch-master-headless
      # Must match elasticsearch password
      password: "0ct0P3rf"
 
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 5
    httpGet:
      path: /actuator/health/readiness
      port: http-port
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    httpGet:
      path: /actuator/health
      port: http-port

  # scheduler name
  # schedulerName: ""

  ## priorityClassName
  ##
  priorityClassName: ""

  ## Additional backend Secret mounts
  # Defines additional mounts with secrets. Secrets must be manually created in the namespace.
  secretMounts: []
    # - name: secret-files
    #   mountPath: /etc/secrets
    #   subPath: ""
    #   secretName: backend-secret-files
    #   readOnly: true

  ## Node labels for backend pod assignment
  ## Ref: https://kubernetes.io/docs/user-guide/node-selection/
  ##
  nodeSelector: {}

  # The default is to deploy all pods serially. By setting this to parallel all pods are started at
  # the same time when bootstrapping the cluster
  podManagementPolicy: Parallel

  updateStrategy: RollingUpdate

  ## Use an alternate scheduler, e.g. "stork".
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
  ##
  # schedulerName:

  # Custom backend volumes
  volumes: []
  volumeMounts: []

  persistentVolume:
    ## If true, backend will create/use a Persistent Volume Claim
    ## If false, use emptyDir
    ##
    enabled: true

    ## backend data Persistent Volume access modes
    ## Must match those of existing PV or dynamic provisioner
    ## Ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
    ##
    accessModes:
      - ReadWriteOnce

    ## backend data Persistent Volume Claim annotations
    ##
    annotations: {}

    ## backend data Persistent Volume mount root path
    ##
    mountPath: /home/octoperf/data

    ## backend data Persistent Volume size
    ##
    size: 10Gi

    ## backend data Persistent Volume Storage Class
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If set to "local-storage", the chart also creates the local-storage StorageClass
    ## If empty (the default), no storageClassName spec is
    ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
    ##   GKE, AWS & OpenStack)
    ## storageClassName, its name up to 18.0.0, is still read when storageClass is empty
    ##
    storageClass: ""

    ## Subdirectory of backend data Persistent Volume to mount
    ## Useful if the volume's root directory is not empty
    ##
    subPath: ""

  ## backend resource requests and limits
  ## Ref: http://kubernetes.io/docs/user-guide/compute-resources/
  ##
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 256Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi

  ## Security context to be added to backend pods
  ##
  securityContext: {}
  #  fsGroup: 9001
  #  runAsGroup: 9001
  #  runAsNonRoot: true
  #  runAsUser: 9001

  ## Security context of the backend container (Kubernetes manifest, camelCase). Empty = not set.
  ## The image runs as the octoperf user (uid and gid 9001), declared by name: runAsNonRoot needs runAsUser.
  ## ref: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context-1
  containerSecurityContext: {}
  #  allowPrivilegeEscalation: false
  #  runAsNonRoot: true
  #  runAsUser: 9001
  #  capabilities:
  #    drop:
  #      - ALL
  #  seccompProfile:
  #    type: RuntimeDefault

  headless:
    annotations: {}
    labels: {}
    publishNotReadyAddresses: true

  service:
    annotations: {}
    labels: {}
    clusterIP: ""

    ## List of IP addresses at which the backend service is available
    ## Ref: https://kubernetes.io/docs/user-guide/services/#external-ips
    ##
    externalIPs: []

    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    # nodePort: 30000

mcpServer:
  # Make sure to configure "hostname: YOUR_PUBLIC_HOSTNAME" below before enabling mcp server (needed to work properly)
  enabled: false
  image: octoperf/mcp-server
  replicas: 1
  port: 8091

  # config/application.yml
  applicationYml: |-
    server:
      hostname: YOUR_PUBLIC_HOSTNAME
      public:
        port: 80

  annotations: {}

  podAnnotations: {}

  # serviceAccountName: "myServiceAccount"

  initContainers: []

  affinity: {}
  #  podAntiAffinity:
  #  requiredDuringSchedulingIgnoredDuringExecution:
  #  - labelSelector:
  #      matchExpressions:
  #      - key: app
  #        operator: In
  #        values:
  #        - {{ template "name" . }}-backend
  #    topologyKey: "kubernetes.io/hostname"

  tolerations: {}

  # Extra /etc/hosts entries injected into the mcp-server pod.
  # The mcp-server is an OAuth2 resource server: at startup it resolves the
  # backend's OIDC issuer (server.hostname) to fetch the authorization-server
  # metadata + JWKS, and it also calls the backend REST API on that same host.
  # In a real cluster the public hostname already resolves from pods, so this
  # stays empty. It is only needed when the hostname is not resolvable in-cluster
  # to the backend/ingress (e.g. a hostname that only resolves to 127.0.0.1).
  # Example:
  #   hostAliases:
  #     - ip: 192.168.49.2
  #       hostnames:
  #         - octoperf.example.com
  hostAliases: []

  env:
    JAVA_OPTS: "-Xmx512m"

  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 5
    httpGet:
      path: /actuator/health/readiness
      port: http-port
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    httpGet:
      path: /actuator/health
      port: http-port

  # scheduler name
  # schedulerName: ""

  ## Additional backend Secret mounts
  # Defines additional mounts with secrets. Secrets must be manually created in the namespace.
  secretMounts: []
    # - name: secret-files
    #   mountPath: /etc/secrets
    #   subPath: ""
    #   secretName: backend-secret-files
    #   readOnly: true

  ## Node labels for backend pod assignment
  ## Ref: https://kubernetes.io/docs/user-guide/node-selection/
  ##
  nodeSelector: {}

  ## Deployment update strategy
  ## Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  strategy:
    type: RollingUpdate

  ## Use an alternate scheduler, e.g. "stork".
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
  ##
  # schedulerName:

  # Custom backend volumes
  volumes: []
  volumeMounts: []

  ## backend resource requests and limits
  ## Ref: http://kubernetes.io/docs/user-guide/compute-resources/
  ##
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 256Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi

  ## Security context to be added to backend pods
  ##
  securityContext: {}
  #  fsGroup: 9001
  #  runAsGroup: 9001
  #  runAsNonRoot: true
  #  runAsUser: 9001

  ## Security context of the mcp-server container (Kubernetes manifest, camelCase). Empty = not set.
  ## The image runs as the octoperf user (uid and gid 9001), declared by name: runAsNonRoot needs runAsUser.
  ## ref: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context-1
  containerSecurityContext: {}
  #  allowPrivilegeEscalation: false
  #  runAsNonRoot: true
  #  runAsUser: 9001
  #  capabilities:
  #    drop:
  #      - ALL
  #  seccompProfile:
  #    type: RuntimeDefault

  service:
    annotations: {}
    labels: {}
    clusterIP: ""

    ## List of IP addresses at which the backend service is available
    ## Ref: https://kubernetes.io/docs/user-guide/services/#external-ips
    ##
    externalIPs: []

    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    # nodePort: 30000
    type: ClusterIP

