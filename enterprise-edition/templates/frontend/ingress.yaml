{{- if .Values.frontend.enabled }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "name" . }}-ingress-frontend
  labels:
    app: {{ template "name" . }}-ingress-frontend
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- with include "ingress.annotations" (dict "context" . "middlewares" (list "compress" "strip-ui")) }}{{ . | nindent 2 }}{{ end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  rules:
  {{- $dot := . }}
  {{- range .Values.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
        # Exact /ui + Prefix /ui/: unlike Prefix /ui, does not catch backend paths such as /uixyz,
        # even when the Traefik strictPrefixMatching option is disabled
        - path: /ui
          pathType: Exact
          backend:
            service:
              name: {{ include "name" $dot }}-frontend
              port: 
                number: {{ $dot.Values.frontend.port }}
        - path: /ui/
          pathType: Prefix
          backend:
            service:
              name: {{ include "name" $dot }}-frontend
              port: 
                number: {{ $dot.Values.frontend.port }}
  {{- end }}
{{- end }}
{{- end }}