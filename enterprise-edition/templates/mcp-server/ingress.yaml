{{- if .Values.mcpServer.enabled }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "name" . }}-mcp-server-ingress
  labels:
    app: {{ template "name" . }}-mcp-server-ingress
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- /* No compress middleware: gzip would buffer the Streamable HTTP SSE responses */}}
{{- with include "ingress.annotations" (dict "context" . "middlewares" (list)) }}{{ . | nindent 2 }}{{ end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  rules:
  {{- $dot := . }}
  {{- range .Values.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
        # Exact /mcp + Prefix /mcp/: unlike Prefix /mcp, does not catch backend paths such as /mcpxyz,
        # even when the Traefik strictPrefixMatching option is disabled
        - path: /mcp
          pathType: Exact
          backend:
            service:
              name: {{ include "name" $dot }}-mcp-server
              port: 
                number: {{ $dot.Values.mcpServer.port }}
        - path: /mcp/
          pathType: Prefix
          backend:
            service:
              name: {{ include "name" $dot }}-mcp-server
              port: 
                number: {{ $dot.Values.mcpServer.port }}
  {{- end }}
{{- end }}
{{- end }}