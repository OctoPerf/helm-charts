{{- if .Values.doc.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ template "name" . }}-doc
  labels:
    app: {{ template "name" . }}-doc
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    {{- include "labels" . | nindent 4 }}
spec:
  selector:
    app: "{{ template "name" . }}-doc"
  clusterIP: None
  ports:
  - name: http
    port: {{ .Values.doc.port }}
    protocol: TCP
{{- end }}