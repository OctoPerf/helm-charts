{{- if .Values.doc.enabled }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "name" . }}-ingress-doc
  labels:
    app: {{ template "name" . }}-ingress-doc
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- with include "ingress.annotations" (dict "context" . "middlewares" (list "compress" "doc-trailing-slash" "strip-doc")) }}{{ . | nindent 2 }}{{ end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  rules:
  {{- $dot := . }}
  {{- range .Values.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
        # Exact /doc + Prefix /doc/: unlike Prefix /doc, does not catch backend paths such as /docxyz,
        # even when the Traefik strictPrefixMatching option is disabled
        - path: /doc
          pathType: Exact
          backend:
            service:
              name: {{ include "name" $dot }}-doc
              port: 
                number: {{ $dot.Values.doc.port }}
        - path: /doc/
          pathType: Prefix
          backend:
            service:
              name: {{ include "name" $dot }}-doc
              port: 
                number: {{ $dot.Values.doc.port }}
  {{- end }}
{{- end }}
{{- end }}