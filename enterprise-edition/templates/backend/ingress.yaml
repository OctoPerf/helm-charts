{{- if .Values.backend.enabled }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "name" . }}-ingress-backend
  labels:
    app: {{ template "name" . }}-ingress-backend
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- /* Lowest priority: "/" is the catch-all, every other path (e.g. Exact /doc, shorter than PathPrefix(`/`)) must win */}}
{{- with include "ingress.annotations" (dict "context" . "middlewares" (list "compress") "priority" 1) }}{{ . | nindent 2 }}{{ end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  rules:
  {{- $dot := . }}
  {{- range .Values.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "name" $dot }}-backend
              port: 
                number: {{ $dot.Values.backend.port }}
  {{- end }}
{{- end }}
{{- end }}